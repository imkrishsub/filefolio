name: Windows install

# Follows the README's manual setup on a fresh Windows runner: install the
# prerequisites from the sources the README links, create the venv, install
# requirements, run the tests, then start the server and upload real PDFs.

on:
  push:
    branches: [ master, main, 'ci/**' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  install:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Poppler (poppler-windows release, as linked in the README)
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $release = Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } `
          https://api.github.com/repos/oschwartz10612/poppler-windows/releases/latest
        $asset = $release.assets | Where-Object { $_.name -like '*.zip' } | Select-Object -First 1
        Write-Host "Poppler $($release.tag_name): $($asset.name)"
        Invoke-WebRequest $asset.browser_download_url -OutFile poppler.zip
        Expand-Archive poppler.zip -DestinationPath C:\poppler
        $bin = Get-ChildItem C:\poppler -Recurse -Filter pdftoppm.exe | Select-Object -First 1
        $bin.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Install Tesseract (UB Mannheim build) and Ghostscript
      run: |
        choco install tesseract ghostscript -y --no-progress
        "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        $gs = Get-ChildItem "C:\Program Files\gs" -Recurse -Filter gswin64c.exe | Select-Object -First 1
        $gs.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Check the prerequisites are on PATH
      run: |
        pdftoppm -v
        tesseract --version
        gswin64c --version

    - name: README step 2 as written (python3 -m venv venv)
      id: readme-venv
      continue-on-error: true
      run: python3 -m venv venv-readme-check

    - name: Create venv, install requirements, run tests (README steps 2-3)
      run: |
        python -m venv venv
        venv\Scripts\activate
        pip install -r requirements.txt
        pytest -q

    - name: Start the server and upload real PDFs (README step 5)
      env:
        # No Ollama on the runner: exercises the documented rule-based fallback.
        OLLAMA_HOST: http://127.0.0.1:9
      run: |
        $server = Start-Process -FilePath venv\Scripts\python.exe -ArgumentList backend\main.py `
          -RedirectStandardOutput server.out.log -RedirectStandardError server.err.log -PassThru
        try {
          venv\Scripts\python.exe .github\scripts\smoke_test.py http://127.0.0.1:8000
          if ($LASTEXITCODE -ne 0) { throw "smoke test failed" }
        } finally {
          Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          Write-Host "--- server stdout"; Get-Content server.out.log -ErrorAction SilentlyContinue
          Write-Host "--- server stderr"; Get-Content server.err.log -ErrorAction SilentlyContinue
        }

    - name: Report README step 2 result
      if: always()
      run: |
        Write-Host "python3 -m venv (README step 2 as written): ${{ steps.readme-venv.outcome }}"
