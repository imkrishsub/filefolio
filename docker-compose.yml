services:
  filefolio:
    build: .
    ports:
      # PORT picks the host port; the app always listens on 8000 in the container.
      - "${PORT:-8000}:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
      - ./thumbnails:/app/thumbnails
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      # Local time zone for upload times and stored filenames, e.g. Europe/Berlin.
      - TZ=${TZ:-UTC}
    restart: unless-stopped
