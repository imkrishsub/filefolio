<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FileFolio - Document organization</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="language-selector">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>
        <select id="language-select" title="Select language">
            <option value="en">English</option>
            <option value="es">Español</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
            <option value="zh">中文</option>
        </select>
    </div>

    <div class="container">
        <header>
            <h1 data-i18n="app.title">FileFolio</h1>
            <p data-i18n="app.subtitle">Drop your PDFs to organize them automatically</p>
            <a href="https://ko-fi.com/krishsub" target="_blank" class="kofi-link" title="Support me on Ko-fi">
                <img src="https://ko-fi.com/img/githubbutton_sm.svg" alt="Support me on Ko-fi">
            </a>
        </header>

        <main>
            <div id="drop-zone" class="drop-zone">
                <div class="drop-zone-content">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    <p data-i18n="dropzone.text">Drag & drop PDF files here</p>
                    <p class="hint" data-i18n="dropzone.hint">or click to browse</p>
                    <input type="file" id="file-input" accept=".pdf" multiple hidden>
                </div>
            </div>

            <div id="status" class="status"></div>

            <section class="search-section">
                <div class="search-container">
                    <input type="text" id="search-input" data-i18n="search.placeholder" placeholder="Search documents by name, content, tags, or category..." />
                    <button id="clear-search" class="clear-btn" style="display: none;">&times;</button>
                </div>
            </section>

            <section class="documents-section">
                <div class="documents-header">
                    <h2 data-i18n="documents.title">Documents</h2>
                    <div class="header-controls">
                        <button id="download-selected-btn" class="btn btn-primary" style="display: none;" data-i18n-title="button.download">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="7 10 12 15 17 10"></polyline>
                                <line x1="12" y1="15" x2="12" y2="3"></line>
                            </svg>
                            <span id="download-btn-text" data-i18n="button.download">Download</span>
                        </button>
                        <button id="dark-mode-toggle" class="view-btn" data-i18n-title="view.dark_mode">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                            </svg>
                        </button>
                        <div class="view-toggle">
                            <button id="grid-view-btn" class="view-btn active" data-i18n-title="view.grid">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="3" width="7" height="7"></rect>
                                    <rect x="14" y="3" width="7" height="7"></rect>
                                    <rect x="14" y="14" width="7" height="7"></rect>
                                    <rect x="3" y="14" width="7" height="7"></rect>
                                </svg>
                            </button>
                            <button id="table-view-btn" class="view-btn" data-i18n-title="view.table">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="3" y1="6" x2="21" y2="6"></line>
                                    <line x1="3" y1="12" x2="21" y2="12"></line>
                                    <line x1="3" y1="18" x2="21" y2="18"></line>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
                <div id="documents-list" class="documents-list">
                    <p class="empty-state" data-i18n="documents.empty">No documents yet. Upload some PDFs to get started!</p>
                </div>
                <table id="documents-table" class="documents-table" style="display: none;">
                    <thead>
                        <tr>
                            <th style="width: 40px;">
                                <input type="checkbox" id="select-all-checkbox" data-i18n-title="table.select_all">
                            </th>
                            <th data-sort="original_filename" class="sortable">
                                <span data-i18n="table.filename">Filename</span>
                                <span class="sort-indicator"></span>
                            </th>
                            <th data-sort="category" class="sortable">
                                <span data-i18n="table.category">Category</span>
                                <span class="sort-indicator"></span>
                            </th>
                            <th data-sort="tags">
                                <span data-i18n="table.tags">Tags</span>
                            </th>
                            <th data-sort="upload_date" class="sortable sorted-desc">
                                <span data-i18n="table.upload_date">Upload date</span>
                                <span class="sort-indicator">▼</span>
                            </th>
                            <th><span data-i18n="table.actions">Actions</span></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="empty-state-row">
                            <td colspan="6">
                                <p class="empty-state" data-i18n="documents.empty">No documents yet. Upload some PDFs to get started!</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <!-- Edit document modal -->
    <div id="edit-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 data-i18n="modal.edit_title">Edit document</h2>
                <button class="modal-close" onclick="closeEditModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="edit-form">
                    <input type="hidden" id="edit-doc-id">

                    <div class="form-group">
                        <label for="edit-filename" data-i18n="form.filename">Filename</label>
                        <input type="text" id="edit-filename" readonly>
                    </div>

                    <div class="form-group">
                        <label for="edit-category" data-i18n="form.category">Category</label>
                        <select id="edit-category" required>
                            <option value="Invoice" data-i18n="category.invoice">Invoice</option>
                            <option value="Receipt" data-i18n="category.receipt">Receipt</option>
                            <option value="Contract" data-i18n="category.contract">Contract</option>
                            <option value="Letter" data-i18n="category.letter">Letter</option>
                            <option value="Report" data-i18n="category.report">Report</option>
                            <option value="Form" data-i18n="category.form">Form</option>
                            <option value="Statement" data-i18n="category.statement">Statement</option>
                            <option value="Legal" data-i18n="category.legal">Legal</option>
                            <option value="Medical" data-i18n="category.medical">Medical</option>
                            <option value="Tax" data-i18n="category.tax">Tax</option>
                            <option value="Insurance" data-i18n="category.insurance">Insurance</option>
                            <option value="Other" data-i18n="category.other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="edit-tags" data-i18n="form.tags">Tags</label>
                        <div class="tags-input-container">
                            <div id="selected-tags" class="selected-tags"></div>
                            <input type="text" id="edit-tags" data-i18n="form.tags_placeholder" placeholder="Type to add tags...">
                            <div id="tag-suggestions" class="tag-suggestions" style="display: none;"></div>
                        </div>
                    </div>

                    <div class="modal-actions">
                        <button type="button" class="btn btn-secondary" onclick="closeEditModal()" data-i18n="button.cancel">Cancel</button>
                        <button type="submit" class="btn btn-primary" data-i18n="button.save">Save changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Preview document modal -->
    <div id="preview-modal" class="modal modal-large" style="display: none;">
        <div class="modal-content modal-content-large">
            <div class="modal-header">
                <div class="preview-header-content">
                    <h2 id="preview-title" data-i18n="modal.preview_title">Document preview</h2>
                    <div class="preview-actions">
                        <button class="btn-icon" onclick="downloadDocument()" data-i18n-title="button.download_doc">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="7 10 12 15 17 10"></polyline>
                                <line x1="12" y1="15" x2="12" y2="3"></line>
                            </svg>
                        </button>
                        <button class="btn-icon" onclick="openInNewTab()" data-i18n-title="button.open_new_tab">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                                <polyline points="15 3 21 3 21 9"></polyline>
                                <line x1="10" y1="14" x2="21" y2="3"></line>
                            </svg>
                        </button>
                    </div>
                </div>
                <button class="modal-close" onclick="closePreviewModal()">&times;</button>
            </div>
            <div class="modal-body modal-body-preview">
                <iframe id="pdf-viewer" width="100%" height="100%" frameborder="0"></iframe>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
